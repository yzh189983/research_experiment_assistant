<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}科研实验助手{% endblock %}</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/pages.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="nav">
  <a class="brand" href="/">
    <span class="brand-mark"></span>
    <span>科研实验助手</span>
    <small>rekit</small>
  </a>
  <nav class="nav-links">
    <a href="/" class="{{ 'on' if active=='exp' }}">实验</a>
    <a href="/hosts" class="{{ 'on' if active=='hosts' }}">服务器</a>
    <a href="/terminal" class="{{ 'on' if active=='terminal' }}">终端</a>
    <a href="/profile" class="{{ 'on' if active=='profile' }}">个人主页</a>
    <a href="/settings" class="{{ 'on' if active=='settings' }}">设置</a>
  </nav>
  <div class="nav-user">
    <a class="nav-user-name" href="/profile" title="打开个人主页">{{ current_user.username if current_user else '' }}</a>
    <form method="post" action="/logout" style="display:inline"><button class="nav-logout" type="submit" title="退出登录">退出</button></form>
  </div>
</header>
<main class="wrap">
{% block body %}{% endblock %}
</main>
{% if active != 'terminal' %}
<footer class="foot">
  <span>科研实验助手 · rekit</span>
  <span>本地运行 · 仅监听 127.0.0.1 · 数据存于 data/</span>
</footer>
{% endif %}
<div id="toast" class="toast"></div>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
