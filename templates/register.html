<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册账号 · 科研实验助手</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:var(--bg)}
.auth-card{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--border)}
.auth-top{padding:30px 32px 22px;border-bottom:1px solid var(--rule)}
.auth-mark{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink)}
.auth-mark .brand-mark{width:12px;height:12px;background:var(--accent);display:inline-block}
.auth-top h1{font-family:var(--serif);font-size:28px;font-weight:500;margin:20px 0 6px;letter-spacing:-.01em}
.auth-top p{font-size:12.5px;color:var(--muted);line-height:1.6}
.auth-body{padding:26px 32px 30px}
.auth-label{display:block;font-size:11px;letter-spacing:var(--tracking);text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.auth-input{width:100%;height:38px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--paper);outline:none}
.auth-input:focus{border-color:var(--accent)}
.auth-field{margin-bottom:16px}
.auth-error{background:var(--err-soft);border:1px solid #E2C9C4;color:var(--err);font-size:12.5px;padding:9px 11px;border-radius:var(--radius);margin-bottom:16px}
.auth-submit{width:100%;height:40px}
.auth-foot{padding:16px 32px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-top">
      <div class="auth-mark"><span class="brand-mark"></span>科研实验助手 <small style="color:var(--faint)">rekit</small></div>
      <h1>注册账号</h1>
      <p>创建成员账号，数据将按你的账号独立保存。</p>
    </div>
    <div class="auth-body">
      {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('register_page', next=next) }}">
        <div class="auth-field">
          <label class="auth-label" for="u">用户名</label>
          <input class="auth-input" id="u" name="username" autocomplete="username" required autofocus minlength="2" maxlength="32">
        </div>
        <div class="auth-field">
          <label class="auth-label" for="p">密码（至少 6 位）</label>
          <input class="auth-input" id="p" name="password" type="password" autocomplete="new-password" required minlength="6" maxlength="128">
        </div>
        <div class="auth-field">
          <label class="auth-label" for="p2">确认密码</label>
          <input class="auth-input" id="p2" name="confirm" type="password" autocomplete="new-password" required minlength="6" maxlength="128">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn primary auth-submit" type="submit">注册并进入</button>
      </form>
    </div>
    <div class="auth-foot">已有账号？<a href="{{ url_for('login_page') }}">返回登录</a></div>
  </div>
</div>
</body>
</html>
